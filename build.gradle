apply plugin: 'java'

apply plugin: 'kotlin'

sourceCompatibility = 21
targetCompatibility = 21

buildscript {

    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.10"
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        kotlin {
            srcDir 'src'
        }
        java {
            srcDir 'src'
        }
        resources {
            srcDir 'resources'
            srcDir 'docs'
        }
    }
    test {
        kotlin {
            srcDir 'test/kotlin'
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.10"


    implementation 'org.python:jython-standalone:2.7.0' // use this for extension jar
    // runtimeOnly 'org.python:jython-standalone:2.7.0' // use this for library jar

    implementation 'com.fifesoft:rsyntaxtextarea:3.1.1'
    implementation 'com.fifesoft:rstaui:3.1.1'
    implementation files('hpack-1.0.2.jar')
    implementation files('albinowaxUtils-all.jar') // includes burp wiener API
    implementation 'tech.kwik:kwik:0.10.3'
    // implementation files('http2-spike-enhanced-obfuscated.jar') // used for research only

    // MCP Server
    implementation 'io.modelcontextprotocol.sdk:mcp:0.17.0'

    // Embedded Jetty for MCP HTTP transport
    // 12.1.x required: 12.0.x's encoding.properties lacks `image/*=-` and its
    // MimeTypes loader crashes if Burp's newer encoding.properties is loaded
    // instead (via parent-first resource lookup when running as a Burp extension).
    implementation 'org.eclipse.jetty.ee10:jetty-ee10-servlet:12.1.9'
    implementation 'org.eclipse.jetty:jetty-server:12.1.9'

    // Logging for MCP debugging
    implementation 'ch.qos.logback:logback-classic:1.5.6'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    // testImplementation 'io.mockk:mockk:1.13.13'  // Add when needed
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

jar {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    archiveFileName = 'turbo-intruder.jar'
    manifest {
        attributes('Main-Class': 'burp.Fast_httpKt')
    }
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    // Signed dependencies (at.favre.lib:hkdf, pulled in by Kwik) ship signature files that stop
    // describing the archive once it is repackaged. Left in, the JVM refuses to define any class
    // from this jar and Burp reports "Extension class is not a recognized type".
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/*.EC'
}

// Ensure tests run before build
build.dependsOn test
